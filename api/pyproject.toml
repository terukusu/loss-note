[project]
name = "loss-note-api"
version = "0.1.0"
description = "loss-note の API（Flask）"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 正確な版とハッシュは uv.lock で固定する
    "flask>=3.1,<3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# 公開から 2 週間未満の版を入れない（サプライチェーン対策）。更新するときはこの日付を進めて uv lock する
exclude-newer = "2026-11-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
