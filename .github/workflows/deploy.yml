# main の infra/prod（Cloud Run loss-note。Issue #42・ADR-0009）を本番へ反映する。手順・確認・切り戻しは infra/README.md「prod（Cloud Run）」。
#
# - 動くのは main への push の CI（ci.yml の check）が成功した後だけ（workflow_run。例 D3）。fork の PR の main という名前のブランチを
#   弾くため、元の run が push で、このリポジトリのものであることも確かめる。手で動かすとき（workflow_dispatch）は main だけ
# - plan に差分があるときだけ apply job が動き、Environment prod（main だけ・所有者の承認）を待つ（差分 0 なら承認待ちを作らない。例 D2）
# - apply は 1 度に 1 つ（plan job が動く run だけが concurrency terraform-prod・cancel-in-progress: false。切り戻しの rollback.yml と同じ。例 D7）
# - 手で動かしたときも、そのコミットの ci の成功を確かめてから plan する
# - plan ファイルは artifact で渡さない（公開リポジトリの artifact は誰でも取得でき、state 由来の値を含む）。apply は承認の後に plan し直す
# - イメージ: タグは入力の git のハッシュと画面のビルドの変数（.github/scripts/image.sh）。Artifact Registry に無ければ apply job が
#   GCP の認証より前にビルド・検査し、認証の後に push してから digest で apply する
# - repository secrets が無い（clone して使う人）ときは notice を出して何もしない（例 D5）。GCP の secrets はあるのに Firebase の Web の設定の
#   secrets が無いときは、ビルドの前に足りない名前を出して失敗する（例 D8）
# - pull_request_target は使わない（#41 の申し送り。plan SA はこのリポジトリのどの workflow からも借用できる）
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# apply は 1 度に 1 つ。GitHub の concurrency は「同じグループの pending は 1 つだけで、新しく入った run が前の pending を取り消す」。
# plan job の if で弾かれる run（CI の失敗・取り消し、fork の PR の main という名前のブランチの CI の完了など）まで terraform-prod に入ると、
# 正当な pending の deploy・rollback を取り消してしまうので、plan job の if と同じ条件のときだけ terraform-prod に入れ、
# それ以外は run ごとの別のグループにする。**式は plan job の if と対**（片方を直したら両方を直す。.github/scripts/workflow-concurrency-check.sh が突き合わせる）
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'terraform-prod' || format('deploy-skip-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# プロジェクト固有の値（プロジェクト ID・SA・state のバケット・Firebase の Web の設定・WIF のプロバイダ）はすべて repository secrets
# から読む（公開リポジトリの Actions のログは誰でも読めるので、見出しの env の一覧・コマンドの出力に値を出さない。secrets は
# GitHub が自動で伏せる。repository variables は使わない。例外は値を伏せる必要の無い切り替え STATEMENT_READ_CREDENTIAL と
# STATEMENT_READ_KEY だけ = 下の TF_VAR_statement_read_credential・TF_VAR_statement_read_key。secrets にするとログの方式の名前・
# true がすべて伏せ字になり、plan・検査のログが読めなくなるため）
env:
  TF_IN_AUTOMATION: "1"
  # プロジェクト固有の値は repository secrets で渡す（infra/README.md「GitHub の設定」）
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  GCP_SA_TF_PLAN: ${{ secrets.GCP_SA_TF_PLAN }}
  GCP_SA_TF_APPLY: ${{ secrets.GCP_SA_TF_APPLY }}
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  # 明細の読み取りのキーの参照を Cloud Run に付けるか（#44）。オーナーが Secret Manager にキーの版を入れた後に、repository variable
  # STATEMENT_READ_KEY を true にする（未設定・true 以外なら false = 参照を付けない。版の無い参照ではインスタンスが起動しないため）。
  # 秘密ではない真偽の切り替えなので、例外として variables に置く（値を伏せる必要が無く、secrets だと true が伏せ字になる）
  TF_VAR_statement_read_key: ${{ vars.STATEMENT_READ_KEY == 'true' }}
  # 明細の読み取りの資格情報の方式（#55・ADR-0011。api_key / oauth_token / federation。未設定なら空 = STATEMENT_READ_KEY を見る）。
  # 方式の値は、api_key・oauth_token は Secret Manager（オーナーがコンソールで版を入れる）、federation の識別子は repository
  # secrets（Terraform の変数は sensitive。plan に出さない）
  TF_VAR_statement_read_credential: ${{ vars.STATEMENT_READ_CREDENTIAL }}
  TF_VAR_statement_read_federation_rule_id: ${{ secrets.STATEMENT_READ_FEDERATION_RULE_ID }}
  TF_VAR_statement_read_organization_id: ${{ secrets.STATEMENT_READ_ORGANIZATION_ID }}
  TF_VAR_statement_read_service_account_id: ${{ secrets.STATEMENT_READ_SERVICE_ACCOUNT_ID }}
  TF_VAR_statement_read_workspace_id: ${{ secrets.STATEMENT_READ_WORKSPACE_ID }}
  # 画面のビルドに渡す Firebase の Web の設定（公開の JS に入る値。秘密ではない）。プロジェクト ID は GCP_PROJECT_ID を兼ねる
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  # 同じ authDomain を Cloud Run の環境変数にも渡す（API の CSP のヘッダの frame-src。#43）
  TF_VAR_firebase_auth_domain: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  # 失敗時のログの末尾に使うマスク: 9 桁以上の数字（プロジェクト番号など）と、SA 以外のメールアドレス
  MASK_SED: >-
    s/[0-9]{9,}/<num>/g;
    s/@([A-Za-z0-9-]+)\.iam\.gserviceaccount\.com/__SA__\1__/g;
    s/[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+\.)+[A-Za-z]{2,}/<email>/g;
    s/__SA__([A-Za-z0-9-]+)__/@\1.iam.gserviceaccount.com/g
  # terraform show -json の出力から「アドレス: 操作」と操作ごとの件数だけを Markdown にする（値は出さない）
  PLAN_SUMMARY_JQ: |
    def ops:
      (if .change.importing then ["import"] else [] end)
      + (.change.actions
         | if . == ["delete", "create"] or . == ["create", "delete"] then ["replace"]
           elif . == ["no-op"] or . == ["read"] then []
           else . end);
    [.resource_changes[]? | {address, ops: ops} | select(.ops | length > 0)] as $rc
    | if ($rc | length) == 0 then "差分なし（No changes）"
      else
        "| 操作 | 件数 |", "|---|---|",
        ($rc | map(.ops[]) | group_by(.) | map("| \(.[0]) | \(length) |")[]),
        "",
        ($rc[] | "- `\(.address)`: \(.ops | join(", "))")
      end

jobs:
  plan:
    # CI の check が main への push で成功した（このリポジトリの）コミットだけ。手で動かすときは main だけ（CI の成功は最初の段で確かめる）。
    # **この式はワークフローの concurrency.group の条件と対**（片方を直したら両方を直す）
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      # 手で動かしたときに main の HEAD の CI の成否を読む
      actions: read
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      exists: ${{ steps.image.outputs.exists }}
      sha: ${{ steps.cfg.outputs.sha }}
    steps:
      # 例 D5: GCP の secrets が無ければ notice で成功終了。例 D8: あるのに Firebase の secrets が無ければ、名前を出して失敗（ビルド・認証より前）
      - name: repository secrets の確認
        id: cfg
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for v in GCP_PROJECT_ID TF_STATE_BUCKET GCP_SA_TF_PLAN GCP_SA_TF_APPLY; do
            if [ -z "${!v}" ]; then
              echo "::notice::repository secret ${v} が未設定なので deploy をスキップ（infra/README.md「GitHub の設定」）"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # repository secret の名前 → それを受ける環境変数（VITE_<名前>）
          missing=()
          for v in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN; do
            name="VITE_${v}"
            if [ -z "${!name}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::repository secret ${missing[*]} が未設定（画面のビルドに渡す Firebase の Web の設定。infra/README.md「prod の変数」）"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      # 例 D3 を手動の経路にも: 手で動かしたときは、そのコミット（main の HEAD）の ci が push で成功していなければ止める
      - name: 手で動かしたときの CI の成功の確認
        if: steps.cfg.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.cfg.outputs.sha }}
        run: |
          n=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success" --jq '.total_count')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::このコミットの ci（main への push）が成功していないので deploy しない（CI が通ってから動かす）"
            exit 1
          fi
          echo "ok: このコミットの ci は成功（${n} 件）"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          ref: ${{ steps.cfg.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_TF_PLAN }}

      # Artifact Registry にあれば digest。無ければ要約のためだけに全 0 の digest で plan する（差分ありとして apply job が動き、
      # apply job が実物の digest で plan し直す。Cloud Run の変数は digest だけを受ける）
      - name: イメージの解決
        id: image
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          resolved=$(.github/scripts/image.sh loss-note resolve)
          image=$(sed -n 's/^image=//p' <<<"$resolved")
          exists=$(sed -n 's/^exists=//p' <<<"$resolved")
          if [ "$exists" != true ]; then
            image="${image%:*}@sha256:$(printf '0%.0s' $(seq 1 64))"
          fi
          {
            echo "tag=$(sed -n 's/^tag=//p' <<<"$resolved")"
            echo "exists=${exists}"
            echo "plan_image=${image}"
          } >> "$GITHUB_OUTPUT"

      - name: terraform plan（prod）
        id: plan
        if: steps.cfg.outputs.enabled == 'true'
        working-directory: infra/prod
        env:
          TF_VAR_image: ${{ steps.image.outputs.plan_image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
          SHA: ${{ steps.cfg.outputs.sha }}
        run: |
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform plan -lock=false -input=false -no-color -detailed-exitcode -out=tfplan; } > plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ] || [ "$IMAGE_EXISTS" != true ]; then changes=true; else changes=false; fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan（infra/prod、${SHA}）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
            if [ "$IMAGE_EXISTS" = true ]; then
              echo "- イメージ loss-note: \`${IMAGE_TAG}\` は既存"
            else
              echo "- イメージ loss-note: \`${IMAGE_TAG}\` は未作成（apply job がビルド・push する。この要約の digest は仮の全 0）"
            fi
            echo
            if [ "$changes" = true ]; then
              echo "差分あり: apply job が Environment prod の承認を待つ。"
            else
              echo "差分なし: apply は行わない。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Environment prod（main だけ・所有者の承認）の job だけが apply SA を借用できる（infra/bootstrap の WIF の attribute.repo_env）
  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # ビルドは GCP の認証より前に行う（依存の取得中に資格情報ファイルが無いように）。検査は ci.yml の check と同じ。
      # --build-arg には名前だけを渡し、値は環境変数から読ませる（コマンド行に値を出さない）
      - name: イメージのビルドと検査（未作成のときだけ）
        if: needs.plan.outputs.exists != 'true'
        run: |
          docker build --build-arg VITE_FIREBASE_PROJECT_ID --build-arg VITE_FIREBASE_API_KEY \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN -t loss-note:build .
          .github/scripts/image-check.sh loss-note:build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_TF_APPLY }}

      # 承認待ちの間に別の run が push した場合に備えてもう一度確かめる。タグは不変（immutable_tags）なので二重 push は失敗で止まる
      - name: イメージの push と digest の解決
        id: image
        env:
          BUILT: ${{ needs.plan.outputs.exists != 'true' }}
        run: |
          script=.github/scripts/image.sh
          resolved=$("$script" loss-note resolve)
          if grep -qx 'exists=false' <<<"$resolved"; then
            if [ "$BUILT" != true ]; then
              echo "イメージが Artifact Registry に無いが、この job ではビルドしていない（plan の後に消えた可能性）。deploy をやり直す。"
              exit 1
            fi
            ref=$(sed -n 's/^image=//p' <<<"$resolved")
            # 出力は認証中のアカウント名を含みうるのでマスクを通す（pipefail で失敗は伝わる）
            gcloud auth configure-docker "${GCP_REGION:-asia-northeast1}-docker.pkg.dev" --quiet 2>&1 | sed -E "$MASK_SED" > /dev/null
            docker tag loss-note:build "$ref"
            docker push --quiet "$ref" 2>&1 | sed -E "$MASK_SED" > /dev/null
            resolved=$("$script" loss-note resolve)
          fi
          image=$(sed -n 's/^image=//p' <<<"$resolved")
          tag=$(sed -n 's/^tag=//p' <<<"$resolved")
          if [[ "$image" != *@sha256:* ]]; then
            echo "digest が得られない"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          digest=${image##*@sha256:}
          echo "イメージ loss-note: \`${tag}\`（digest \`sha256:${digest:0:12}\`）" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: terraform apply（prod）
        working-directory: infra/prod
        env:
          TF_VAR_image: ${{ steps.image.outputs.image }}
        run: |
          # Cloud Run には digest でだけデプロイする（変数の検査でも止まる）
          if [[ "$TF_VAR_image" != *@sha256:* ]]; then
            echo "TF_VAR_image が digest 参照でない"
            exit 1
          fi
          # 承認の後に plan し直し、実際に当てる差分の要約（アドレスと操作の件数だけ）を Summary に残してから、その plan を当てる
          rc=0
          { terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}" \
              && terraform plan -input=false -no-color -out=tfplan; } > apply-plan.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform plan（apply の前）が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 apply-plan.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          {
            echo "### 当てる差分（infra/prod、承認の後の plan）"
            echo
            terraform show -json tfplan | jq -r "$PLAN_SUMMARY_JQ"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          terraform apply -input=false -no-color tfplan > apply.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform apply が失敗した（exit $rc）。ログの末尾（マスク済み）:"
            tail -n 40 apply.log | sed -E "$MASK_SED"
            exit "$rc"
          fi
          grep -E '^Apply complete!' apply.log | tee -a "$GITHUB_STEP_SUMMARY"
