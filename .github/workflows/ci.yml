name: ci

# CLAUDE.md「開発」の確認コマンドと同じ検査を、Node 24・Python 3.13 で走らせる（順番も同じ）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Node の版
        run: node -v
      # lock（package-lock.json）どおりに入れる。package.json と食い違うと失敗する
      - run: npm ci
      - name: 直接の依存が正確な版か
        run: npm run check:pinned
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: CSP の検査の自己テスト
        run: .github/scripts/csp-check.test.sh
      - name: ビルド成果物の検査（CSP。インライン script・style・外部 URL・鍵の形を拒否）
        run: .github/scripts/csp-check.sh dist/index.html
      # API（api/）。Python 3.13 と uv.lock（uv は版とハッシュを固定した .github/uv-requirements.txt から pip で入れる。手元は mise.toml の版）
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Python の版
        run: python -V
      - name: API の依存（uv.lock どおり。食い違うと失敗する）
        working-directory: api
        run: |
          python -m pip install --require-hashes -r ../.github/uv-requirements.txt
          uv sync --locked --python 3.13
      - name: API の lint
        working-directory: api
        run: uv run --locked ruff check
      - name: API のテスト
        working-directory: api
        run: uv run --locked pytest -q
