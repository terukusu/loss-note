<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>損失ノート</title>
  <!-- 損失ノートの印（ログインの画面の印と同じ線）。藍の地に白の線。判定の段の色は使わない。
       ダーク / ライトのどちらのタブでも見えるよう、地は中ほどの明るさの藍。
       この SVG が元で、favicon.ico と apple-touch-icon.png は scripts/make-icons.mjs で作る（Issue #52） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6573f2"/>
      <stop offset="1" stop-color="#3d4fd6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g transform="translate(10 9) scale(1.8333)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 6.5 9 13l3.5-3 3 3.5 5-6"/>
    <path d="M3.5 18.5h17"/>
  </g>
</svg>
