name: ci

# CLAUDE.md「開発」の確認コマンドと同じ検査を、Node 24・Python 3.13 で走らせる（順番も同じ）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # イメージのビルドと検査（#42）の分を足して 30 分
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 個人の値（#80。CLAUDE.md「置かないもの」）: 追跡中のファイルに形（URL・メール・ホームのパス・プロジェクト番号・鍵）と、
      # オーナー名・secrets の値（プロジェクト ID・番号・state のバケット・認証のドメイン）が無いか。依存を入れる前に回し、
      # secrets はこの段の env だけに置く。出力はファイル名・行番号・検査名だけ。fork の PR は secrets が空で、形とオーナー名だけ
      - name: 個人の値の検査の自己テスト
        run: .github/scripts/repo-values-check.test.sh
      - name: 個人の値の検査（形・オーナー名・secrets の値）
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          set -eu
          # プロジェクト番号は WIF のプロバイダ（projects/<番号>/locations/...）から取り、ログに出ないよう先にマスクする
          GCP_PROJECT_NUMBER=$(printf '%s' "$GCP_WIF_PROVIDER" | sed -nE 's#^projects/([0-9]+)/.*#\1#p')
          if [ -n "$GCP_PROJECT_NUMBER" ]; then echo "::add-mask::$GCP_PROJECT_NUMBER"; fi
          unset GCP_WIF_PROVIDER
          export GCP_PROJECT_NUMBER
          .github/scripts/repo-values-check.sh .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Node の版
        run: node -v
      # lock（package-lock.json）どおりに入れる。package.json と食い違うと失敗する
      - run: npm ci
      - name: 直接の依存が正確な版か
        run: npm run check:pinned
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: CSP の検査の自己テスト
        run: .github/scripts/csp-check.test.sh
      - name: ビルド成果物の検査（CSP。インライン script・style・外部 URL・鍵の形を拒否）
        run: .github/scripts/csp-check.sh dist/index.html
      # API（api/）。Python 3.13 と uv.lock（uv は版とハッシュを固定した .github/uv-requirements.txt から pip で入れる。手元は mise.toml の版）
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Python の版
        run: python -V
      - name: uv（版とハッシュを固定）
        run: python -m pip install --require-hashes -r .github/uv-requirements.txt
      # 決済明細の読み取りの部品（packages/statement-read/。API と道具が共有する。#11）。AI の SDK と資格情報は使わない
      - name: 読み取りの部品の依存（uv.lock どおり）
        working-directory: packages/statement-read
        run: uv sync --locked --python 3.13
      - name: 読み取りの部品の lint
        working-directory: packages/statement-read
        run: uv run --locked ruff check
      - name: 読み取りの部品のテスト
        working-directory: packages/statement-read
        run: uv run --locked pytest -q
      - name: API の依存（uv.lock どおり。食い違うと失敗する。AI の SDK の依存グループ ai は入れない）
        working-directory: api
        run: uv sync --locked --python 3.13
      - name: API の lint
        working-directory: api
        run: uv run --locked ruff check
      - name: API のテスト
        working-directory: api
        run: uv run --locked pytest -q
      # API の結合のテスト（Firebase のエミュレーター。Auth の本物のトークン・Firestore の読み書きとルール・利用者の分離）。
      # エミュレーターは Java が要る（手元は mise.toml の Temurin 21.0.13）。本体（jar）は初回に取得してキャッシュする
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.13"
      - name: エミュレーターの本体のキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: API のテスト（エミュレーター。スキップを失敗にする）
        run: npm run test:api:emulator
      # 決済明細の読み取りを測る道具（tools/statement-eval/。#14）。AI の SDK（依存グループ ai）と資格情報は使わない
      - name: 道具の依存（uv.lock どおり。既定のグループだけ）
        working-directory: tools/statement-eval
        run: uv sync --locked --python 3.13
      - name: 道具の lint
        working-directory: tools/statement-eval
        run: uv run --locked ruff check
      - name: 道具のテスト
        working-directory: tools/statement-eval
        run: uv run --locked pytest -q
      # Terraform（infra/。#41）。資格情報なし: fmt・validate と、モックのプロバイダの terraform test だけ
      # （bootstrap の plan / apply は所有者が手元で行う。infra/README.md）。版は mise.toml の terraform と揃える
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate（bootstrap）
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -no-color
          terraform -chdir=infra/bootstrap validate -no-color
      - name: terraform test（bootstrap、モックのプロバイダ）
        run: terraform -chdir=infra/bootstrap test -no-color
      - name: 変数なしの plan が必須の変数の未指定で止まるか（bootstrap、モックのプロバイダ）
        run: .github/scripts/tf-required-variables.sh
      - name: IAM の付与の宣言の検査の自己テスト
        run: .github/scripts/tf-iam-grants.test.sh
      - name: IAM の付与の宣言が期待の集合だけか（bootstrap。権威的な型・*.tf.json・module は 0 件）
        run: .github/scripts/tf-iam-grants.sh
      # 明細の読み取りの資格情報（#44）: Secret Manager の版の宣言が 0 件・追跡中のファイルに API キーの接頭辞が 0 件
      - name: 資格情報の値がリポジトリに無いか
        run: .github/scripts/secret-check.sh
      # infra/prod（#42。Cloud Run。deploy.yml が承認の後に apply する）。資格情報なし: validate とモックのプロバイダの test だけ
      - name: terraform validate（prod）
        run: |
          terraform -chdir=infra/prod init -backend=false -input=false -no-color
          terraform -chdir=infra/prod validate -no-color
      - name: terraform test（prod、モックのプロバイダ）
        run: terraform -chdir=infra/prod test -no-color
      - name: 変数なしの plan が必須の変数の未指定で止まるか（prod、モックのプロバイダ）
        run: .github/scripts/tf-required-variables.sh infra/prod project_id image firebase_auth_domain
      # 本番のイメージ（#42。Dockerfile）。Firebase の Web の設定は渡さない（ログインの画面は「設定が無い」の案内になる）
      - name: イメージの入力と .dockerignore の一致
        run: .github/scripts/image.sh loss-note check-dockerignore
      - name: イメージのビルド
        run: docker build -t loss-note:ci .
      - name: イメージの検査（中身・非 root・CSP・起動して振り分けとヘッダ）
        run: .github/scripts/image-check.sh loss-note:ci
      # deploy.yml・rollback.yml の concurrency が job の if と対になっているか（pending の deploy・rollback を取り消さない。#42）
      - name: ワークフローの concurrency の検査の自己テスト
        run: .github/scripts/workflow-concurrency-check.test.sh
      - name: ワークフローの concurrency の検査
        run: .github/scripts/workflow-concurrency-check.sh
