[project]
name = "statement-eval"
version = "0.1.0"
description = "決済明細の AI による読み取りを、合成の明細と手元の実物の明細で測る道具（アプリの依存ではない）"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 正確な版とハッシュは uv.lock で固定する
    # 合成の明細の描画と、送る前の寸法の確認・縮小
    "pillow>=13.0,<13.1",
    # 読み取りの部品（指示・結果の形と検査・送り口・数の純関数）。API と共有する（packages/statement-read/。#11）
    "statement-read",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]
# 実際の AI を呼ぶときだけ入れる（uv sync --locked --group ai）。確認コマンドと CI では入れない
ai = [
    "claude-agent-sdk==0.2.176",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
statement-read = { path = "../../packages/statement-read", editable = true }

[tool.uv]
# 公開から 2 週間未満の版を入れない（サプライチェーン対策。api/ と同じ日付）。更新するときはこの日付を進めて uv lock する
exclude-newer = "2026-11-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
